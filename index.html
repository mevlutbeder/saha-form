<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buhar Kazanı Saha Formu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5fa8">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: tek sütun telefon uygulaması. Üstte durum çubuğu, ortada kaydırılabilen rapor kağıdı, altta cevap paneli. */
  --bg:#e9ecef; --paper:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#c9d1d9;
  --accent:#1f5fa8; --accent-bg:#e3eefa; --ok:#1d7a45; --ok-bg:#e2f3e8; --bad:#b4282a; --bad-bg:#fbe5e5;
  --warn-bg:#fff2c7; --warn:#8a5a00; --chip:#f2f4f6;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --paper:#1a2129; --ink:#e6ebf0; --muted:#9aa7b4; --line:#33404d;
    --accent:#6aa8ee; --accent-bg:#1b3350; --ok:#5fd08f; --ok-bg:#163526; --bad:#ff8a8a; --bad-bg:#3e1d1e;
    --warn-bg:#3a2f12; --warn:#f2c25b; --chip:#232c36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --paper:#1a2129; --ink:#e6ebf0; --muted:#9aa7b4; --line:#33404d;
  --accent:#6aa8ee; --accent-bg:#1b3350; --ok:#5fd08f; --ok-bg:#163526; --bad:#ff8a8a; --bad-bg:#3e1d1e;
  --warn-bg:#3a2f12; --warn:#f2c25b; --chip:#232c36; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--chip);font-size:13px;white-space:nowrap}
.pill.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.pill svg{width:16px;height:16px}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:4px;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
.vpwrap{position:relative;flex:1;min-height:0}
.vp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sizer{position:relative}
.pg{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:20px;background:var(--ink);color:var(--paper);font-size:13px;z-index:3;white-space:nowrap}
.chip button{height:30px;border-radius:15px;border:0;background:var(--paper);color:var(--ink);padding:0 12px;font-weight:500}
.chip.show{display:flex}
/* rapor kağıdı */
.doc{padding:16px 14px 20px}
.doc h1{font-size:16px;font-weight:600;margin:0 0 2px;text-wrap:balance;letter-spacing:.2px}
.doc .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.sec{margin-top:14px;font-size:11.5px;font-weight:600;letter-spacing:.4px;padding:6px 8px;background:var(--chip);border:1px solid var(--line);border-bottom:0}
.tbl{border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:44% 56%;border-top:1px solid var(--line);min-height:36px;cursor:pointer}
.kv:first-child{border-top:0}
.kv .k{padding:7px 8px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.kv .v{padding:7px 8px;font-size:13px;font-family:var(--font-num);font-variant-numeric:tabular-nums;word-break:break-word}
.kv.ro{cursor:default}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-family:var(--font-body);font-size:10px;font-weight:500;background:var(--chip);color:var(--muted);vertical-align:1px}
.tag.auto{background:var(--accent-bg);color:var(--accent)}
.ckh,.ck{display:grid;grid-template-columns:24px 1fr repeat(4,30px)}
.ckh{font-size:10.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.ckh div{padding:5px 0;text-align:center;border-left:1px solid var(--line)}
.ckh div:nth-child(2){text-align:left;padding-left:6px}
.ckh div:first-child{border-left:0}
.ck{border-top:1px solid var(--line);min-height:44px;cursor:pointer}
.ckh + .ck{border-top:0}
.ck .no{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.ck .tx{padding:6px 6px;font-size:12.5px;line-height:1.35;border-left:1px solid var(--line)}
.ck .tx .ref{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.ck .tx .note{display:block;font-size:11px;margin-top:3px;color:var(--bad)}
.ck .tx .dnote{display:block;font-size:11px;margin-top:3px;color:var(--bad);font-style:italic}
.ck .tx .phs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ck .tx .phs img{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
#v-kusurlar{white-space:pre-line;font-family:var(--font-body);font-size:12px;color:var(--bad)}
.sigimg{height:56px;max-width:100%;background:#fff;border-radius:4px}
.sigwrap{border:1px dashed var(--line);border-radius:12px;background:#fff;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:170px;border-radius:12px}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:6px;width:0;background:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--ink);color:var(--paper);font-size:12px;line-height:22px;padding:0}
.photoBtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-weight:500;cursor:pointer}
.photoBtn input{display:none}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.4}
.confirm .row{margin-top:8px}
.ck .m{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:15px}
.ck .m.x{color:var(--ok)}
.ck .m.x.ud{color:var(--bad);background:var(--bad-bg)}
.ck .m.x.dash,.ck .m.x.nu{color:var(--muted)}
.act{background:var(--accent-bg) !important;box-shadow:inset 5px 0 0 var(--accent);outline:3px solid var(--accent);outline-offset:-3px;animation:actBlink 1s ease-in-out infinite}
@keyframes actBlink{0%,100%{outline-color:var(--accent);opacity:1}50%{outline-color:transparent;opacity:.55}}
.miss{background:var(--warn-bg) !important;box-shadow:inset 3px 0 0 var(--warn)}
.res{padding:10px 8px;font-size:13px;font-weight:600}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.foot{margin-top:12px;font-size:10px;color:var(--muted);line-height:1.5}
/* cevap paneli */
.panel{background:var(--paper);border-top:1px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:52%;overflow-y:auto}
.qno{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.qtx{font-size:17px;font-weight:600;line-height:1.35;margin:4px 0 10px;text-wrap:balance}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:15px;font-weight:500}
.ans.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.ans.sel.ud{background:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:20px;font-family:var(--font-num);text-align:center}
.inp.txt{font-size:15px;font-family:var(--font-body);text-align:left}
.unit{font-size:14px;color:var(--muted)}
.btn{height:50px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.4}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.nav .sm{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:transparent;font-size:13px}
.lis{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lis.on{color:var(--bad)}
.lis .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.lis.on .dot{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:10px;border-radius:24px;border:1px solid var(--line);background:var(--chip);font-weight:500}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.kb{margin-top:10px;padding:10px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-bg)}
.kb label{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:6px}
.kb .small{margin-top:6px}
.heard .sm{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:transparent;font-size:12px;margin-left:6px}
#engine .sm{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--accent);color:var(--accent);background:transparent;font-size:12px;margin-left:4px}
.heard{font-size:12.5px;color:var(--ok);margin-top:6px}
.test{display:flex;gap:6px;margin-top:10px}
.test input{flex:1;min-width:0;height:36px;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:0 10px;font-size:13px}
.test button{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 10px;font-size:13px}
.msg{font-size:15px;line-height:1.5}
.msg.ok{color:var(--ok)}
.small{font-size:12.5px;color:var(--muted);line-height:1.5}
@media print{
  body{background:#fff;color:#000}
  .top,.prog,.panel,.chip{display:none !important}
  .app{height:auto;display:block;max-width:none}
  .vpwrap,.vp{position:static;overflow:visible;height:auto}
  .sizer{height:auto !important}
  .pg{position:static;transform:none !important;width:auto !important;box-shadow:none}
  .act,.miss{background:none !important;box-shadow:none !important}
  .kv,.ck{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><b>Buhar kazanı periyodik kontrol</b><span id="stat">Örnek Tekstil, Tuzla</span></div>
    <button class="pill on" id="sndBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sw1" d="M16 9a4 4 0 0 1 0 6"/><path id="sw2" d="M19 6a8 8 0 0 1 0 12"/></svg><span id="sndTxt">Sesli</span></button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="vpwrap">
    <div class="chip" id="chip">Serbest gezinme <button type="button" id="resume">Kaldığım yerden devam</button></div>
    <div class="vp" id="vp"><div class="sizer" id="sizer"><div class="pg" id="pg"><div class="doc" id="doc"></div></div></div></div>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>
<script>
"use strict";
/* ---------- Form tanımı: buhar kazanı periyodik kontrol raporu ---------- */
const F = [
 {sec:"Genel bilgiler", kind:"kv"},
 {id:"kurulus", l:"Raporu isteyen kuruluş", t:"text", v:"Örnek Tekstil San. A.Ş., Tuzla / İstanbul", src:"örnek"},
 {id:"sgk", l:"SGK işyeri sicil no", t:"text", v:"2 1234 01 01 1234567 034", src:"örnek"},
 {id:"katip", l:"İSG-KATİP sözleşme no", t:"text", q:"İSG-KATİP sözleşme numarası nedir?", hint:"Sözleşme, kontrolden en az bir gün önce onaylanmış olmalı."},
 {id:"tarih", l:"Kontrol tarihi", t:"calc"},
 {id:"bas", l:"Başlangıç saati", t:"calc"},
 {id:"bit", l:"Bitiş saati", t:"calc"},
 {id:"gelecek", l:"Gelecek kontrol tarihi", t:"calc"},
 {id:"raporno", l:"Rapor no", t:"calc"},
 {sec:"İş ekipmanının teknik özellikleri", kind:"kv"},
 {id:"marka", l:"Markası / tipi", t:"text", v:"Termo-Pak / 3 geçişli silindirik", src:"geçen yıl"},
 {id:"seri", l:"Seri no", t:"text", v:"TP-2019-0457", src:"geçen yıl"},
 {id:"yil", l:"Üretim yılı", t:"num", unit:"", v:2019, src:"geçen yıl"},
 {id:"yakit", l:"Yakıt türü", t:"choice", opts:["Doğalgaz","Fuel-oil","Kömür","LPG","Elektrik"], v:"Doğalgaz", src:"geçen yıl"},
 {id:"kapasite", l:"Kapasite", t:"num", unit:"kg/h", v:2000, src:"geçen yıl"},
 {id:"tasarim", l:"Tasarım basıncı", t:"num", unit:"bar", v:12, src:"geçen yıl"},
 {id:"isletme", l:"İşletme basıncı", t:"num", unit:"bar", v:10, src:"geçen yıl"},
 {id:"deney", l:"Deney basıncı (1,5 kat)", t:"calc"},
 {id:"ventilSay", l:"Emniyet ventili sayısı", t:"num", unit:"adet", v:2, src:"geçen yıl"},
 {id:"ventil1", l:"Emniyet ventili 1 açma basıncı", t:"num", unit:"bar", q:"Emniyet ventili 1 kaç barda açtı?"},
 {id:"ventil2", l:"Emniyet ventili 2 açma basıncı", t:"num", unit:"bar", q:"Emniyet ventili 2 kaç barda açtı?"},
 {id:"manometre", l:"Manometre sayısı / skalası", t:"text", v:"2 adet / 0-25 bar", src:"geçen yıl"},
 {id:"suSeviye", l:"Su seviye gösterge sayısı", t:"num", unit:"adet", v:2, src:"geçen yıl"},
 {sec:"Kazan genel kontrolleri, yardımcı donanımlar ve tesisat", kind:"ck"},
 {id:"c1", l:"Kazanın sicil kartı veya bakım defteri", ref:"TS 2025", t:"yn"},
 {id:"c2", l:"Kazan işletmecisinin belgesi", ref:"Binaların Yangından Korunması Hk. Yön.", t:"yn"},
 {id:"c3", l:"Yakıt hazırlama ve su hazırlama sistemi", ref:"TS 2025", t:"yn"},
 {id:"c4", l:"Kazana bağlı boru devreleri, vana ve flanşlerde sızıntı yok", ref:"", t:"yn"},
 {id:"c5", l:"Kazan sağlam bir taban üzerine uygun şekilde monte edilmiş", ref:"İş Ekip. Yön.", t:"yn"},
 {id:"c6", l:"Kazan zemin seviyesinden yeterli yükseklikte", ref:"", t:"yn"},
 {id:"c7", l:"Azami işletme basıncı manometre üzerinde işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c8", l:"Manometre ve göstergeler kolayca görülebilir", ref:"TS 497", t:"yn"},
 {id:"c9", l:"Giriş ve çıkış vanaları var, açık/kapalı konumları işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c10", l:"Giriş ve çıkış devrelerinde yön işaretleri var", ref:"", t:"yn"},
 {id:"c11", l:"Boşaltma vanası veya musluğu var", ref:"TS EN 12953-6", t:"yn"},
 {id:"c12", l:"Düşük su koruması ve besleme suyu sistemi çalışıyor", ref:"TS EN 12953-6", t:"yn"},
 {id:"c13", l:"Yakıt ve ısıtıcı devresinde sızıntı yok", ref:"TS 2025", t:"yn"},
 {id:"c14", l:"Gidiş ve dönüş borularında birer termometre (sıcak su kazanlarında)", ref:"TS EN 12953-6", t:"yn", auto:true},
 {id:"c15", l:"Termometrelerde en yüksek akış sıcaklığı işareti (sıcak su kazanlarında)", ref:"TS EN 12953-6", t:"yn", auto:true},
 {id:"c16", l:"Su seviye göstergelerinin camları temiz ve sağlam", ref:"TS 2025", t:"yn"},
 {id:"c17", l:"Su seviye göstergeleri aynı seviyeyi gösteriyor, minimum seviye işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c18", l:"Emniyet ventilleri kazana doğrudan bağlı, çıkış ağızları uygun", ref:"", t:"yn"},
 {id:"c19", l:"Emniyet ventili sayısı yeterli (buhar kazanlarında en az iki)", ref:"TS 2025", t:"yn", auto:true},
 {id:"c20", l:"Kazan dairesi yönetmelik esaslarına uygun", ref:"Binaların Yangından Korunması Hk. Yön.", t:"yn"},
 {id:"c21", l:"Yanma yüzeyleri temiz", ref:"TS 2025", t:"yn"},
 {sec:"Hidrostatik deney ve testler", kind:"ck"},
 {id:"c22", l:"Emniyet ventilleri azami işletme basıncının en çok %10 fazlasında açıyor", ref:"TS EN 12953-8", t:"yn", auto:true},
 {id:"c23", l:"İşletme basıncının 1,5 katında yarım saat deneyde deformasyon ve sızıntı yok", ref:"İş Ekip. Yön., TS EN 13445-5", t:"yn"},
 {id:"c24", l:"Basınç altında gövdede deformasyon, sızdırma veya şekil bozukluğu yok", ref:"İş Ekip. Yön.", t:"yn"},
 {id:"c25", l:"Manometreler doğru ve kalibrasyonları geçerli", ref:"TS 2025", t:"yn"},
 {sec:"Notlar ve sonuç", kind:"kv"},
 {id:"notlar", l:"Notlar", t:"text", optional:true, q:"Eklemek istediğin bir not var mı?"},
 {id:"kusurlar", l:"Tespit edilen uygunsuzluklar", t:"calc"},
 {id:"sonuc", l:"Sonuç", t:"calc"},
 {sec:"Kontrolü yapan", kind:"kv"},
 {id:"ad", l:"Adı soyadı", t:"text", v:"Örnek Mühendis", src:"profil"},
 {id:"meslek", l:"Mesleği", t:"text", v:"Makine mühendisi", src:"profil"},
 {id:"ekipnet", l:"EKİPNET kayıt no", t:"text", v:"K00000000", src:"profil"},
 {id:"imza", l:"İmza", t:"sign", q:"İmzanı aşağıdaki alana at."}
];
const YN = [["U","Uygun"],["UD","Uygun değil"],["-","Yok"],["NU","Uygulanmaz"]];
const byId = {}; F.forEach(f=>{ if(f.id) byId[f.id]=f; });
const ORDER = F.filter(f=>f.id && f.t!=="calc" && !f.optional).map(f=>f.id);
const OUT = 0.46;

/* ---------- Durum ---------- */
let S = {vals:{}, src:{}, over:{}, bas:null, bit:null, tarih:null};
let scrollGoal = null;
let cur = null, scale = 1, manual = false, soundMode = "all", started = false, pendingTimer = null;
const KEY = "pk-buhar-saha-v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.vals) S = s; }catch(e){} }
function initVals(){
  F.forEach(f=>{ if(f.id && f.v!==undefined && S.vals[f.id]===undefined){ S.vals[f.id]=f.v; S.src[f.id]=f.src; } });
  if(!S.tarih){ S.tarih = new Date().toISOString(); }
}

/* ---------- Yardımcılar ---------- */
const $ = id => document.getElementById(id);
const trn = n => (Math.round(n*100)/100).toString().replace(".", ",");
const fmtDate = d => d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtTime = d => d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function isEmpty(id){ const v=S.vals[id]; return v===undefined || v===null || v===""; }

/* ---------- Kurallar (yapay zekâ yok, sadece hesap) ---------- */
let lastWarn = "";
function compute(){
  const v = S.vals, isl = Number(v.isletme);
  const lim = isl ? Math.round(isl*1.1*100)/100 : null;
  v.deney = isl ? trn(isl*1.5)+" bar" : "";
  const t = new Date(S.tarih);
  v.tarih = fmtDate(t);
  const g = new Date(t); g.setFullYear(g.getFullYear()+1); v.gelecek = fmtDate(g);
  v.raporno = "PK-"+t.toISOString().slice(0,10).replace(/-/g,"")+"-001";
  v.bas = S.bas ? fmtTime(new Date(S.bas)) : "";
  v.bit = S.bit ? fmtTime(new Date(S.bit)) : "";
  ["c14","c15"].forEach(id=>{ if(!S.over[id]){ v[id]="NU"; S.src[id]="otomatik"; } });
  byId.c14.note = byId.c15.note = S.over.c14 ? "" : "Buhar kazanında uygulanmaz.";
  if(!S.over.c19){
    if(v.ventilSay!==undefined && v.ventilSay!==null && v.ventilSay!==""){ v.c19 = Number(v.ventilSay)>=2 ? "U" : "UD"; S.src.c19="otomatik"; }
  }
  byId.c19.note = (v.c19==="UD" && !S.over.c19) ? "Buhar kazanında en az iki emniyet ventili gerekir." : "";
  byId.c22.note = "";
  if(!S.over.c22 && lim!==null && !isEmpty("ventil1") && (Number(v.ventilSay)<2 || !isEmpty("ventil2"))){
    const a = Number(v.ventil1), b = isEmpty("ventil2") ? 0 : Number(v.ventil2);
    const bad = a>lim || b>lim;
    v.c22 = bad ? "UD" : "U"; S.src.c22 = "otomatik";
    if(bad) byId.c22.note = "Sınır "+trn(lim)+" bar. Ölçülen: "+trn(a)+(isEmpty("ventil2")?"":" ve "+trn(b))+" bar.";
  } else if(!S.over.c22){ v.c22 = null; }
  const kl = F.filter(f=>f.t==="yn" && v[f.id]==="UD").map(f=>{ const d=S.defects[f.id]; return "Madde "+NUM[f.id]+": "+((d&&d.note)||f.note||f.l)+((d&&d.photos&&d.photos.length)?" ("+d.photos.length+" fotoğraf)":""); });
  v.kusurlar = kl.length ? kl.join("\n") : (ORDER.filter(isEmpty).length ? "" : "Yok");
  const missing = ORDER.filter(isEmpty);
  if(missing.length) v.sonuc = "";
  else v.sonuc = ORDER.some(id=>v[id]==="UD") ? "UYGUN DEĞİL: belirtilen uygunsuzluklar giderilmeden kullanılması sakıncalıdır." : "UYGUNDUR: bir sonraki periyodik kontrole kadar belirtilen şartlarda kullanılabilir.";
}
function ruleHint(id){
  const isl = Number(S.vals.isletme);
  if((id==="ventil1"||id==="ventil2") && isl) return "İşletme basıncı "+trn(isl)+" bar. Sınır "+trn(isl*1.1)+" bar (en çok %10 fazlası).";
  return byId[id].hint || "";
}
function checkWarn(id, val){
  const isl = Number(S.vals.isletme);
  if((id==="ventil1"||id==="ventil2") && isl && Number(val) > isl*1.1) return "Uyarı: ventil "+trn(val)+" barda açıyor, sınır "+trn(isl*1.1)+" bar. Madde 22 uygun değil olarak işaretlenecek.";
  if(id==="ventilSay" && Number(val)<2) return "Uyarı: buhar kazanında en az iki emniyet ventili gerekir.";
  return "";
}

    }

const vp = $("vp"), pg = $("pg"), sizer = $("sizer");
function layout(){
  const W = vp.clientWidth;
  pg.style.width = W+"px";
  applyScale(scale, null, false);
}
function applyScale(s, rowId, smooth){
  scale = 1;
  pg.style.transform = "none";
  sizer.style.height = pg.offsetHeight+"px";
  if(rowId){
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const target = ()=>{ const r = $("r-"+rowId); if(!r) return 0; return Math.max(0,(r.offsetTop + r.offsetHeight/2)*scale - vp.clientHeight/2); };
    scrollGoal = rowId;
    vp.scrollTo({top:target(), behavior:(smooth&&!reduce)?"smooth":"auto"});
    setTimeout(()=>{ if(scrollGoal===rowId && !manual){ const t=target(); if(Math.abs(vp.scrollTop-t)>4) vp.scrollTo({top:t, behavior:"smooth"}); } }, 560);
  }
}

let VOICES = [], voicePick = null;
try{ voicePick = localStorage.getItem("pk-voice"); }catch(e){}
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)); }catch(e){ VOICES=[]; } voiceRow(); }
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} }
function voiceScore(v){ const n=v.name.toLowerCase(); let sc=0;
  if(/natural|neural|online|enhanced|premium|wavenet|studio/.test(n)) sc+=5;
  if(/google/.test(n)) sc+=2; if(/microsoft/.test(n)) sc+=1; if(!v.localService) sc+=1; return sc; }
function bestVoice(){ if(!VOICES.length) return null; if(voicePick){ const v=VOICES.find(x=>x.name===voicePick); if(v) return v; }
  return VOICES.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]; }

/* Telefon konuşurken mikrofon asla açılmaz: okuma gerçekten bitince kısa bir sessizlik bırakılır, sonra dinlenir */
let ttsBusy = false, lastSpoken = "", ttsSeq = 0;
function speak(text, isWarn, cb){
  const ok = soundMode==="all" || (soundMode==="warn" && isWarn);
  if(!ok || !("speechSynthesis" in window)){ if(cb) cb(); return; }
  if(rec || listening) stopListen();
  const my = ++ttsSeq;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "tr-TR"; u.rate = 1.0; const bv = bestVoice(); if(bv) u.voice = bv;
    ttsBusy = true; lastSpoken = text;
    let called = false, waited = 0;
    const done = ()=>{ if(called) return; called = true; if(my===ttsSeq) ttsBusy = false; if(cb) setTimeout(cb, 450); };
    const fin = ()=>{ if(called) return;
      if((speechSynthesis.speaking || speechSynthesis.pending) && waited < 20000){ waited += 150; setTimeout(fin, 150); return; }
      done(); };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 2500 + text.length*110);
    speechSynthesis.speak(u);
  }catch(e){ ttsBusy = false; if(cb) cb(); }
}
function isEcho(t){ const a = norm(t), b = norm(lastSpoken); return a.length > 5 && b.includes(a); }
const IN_FRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
let micMsg = "", listenFor = null, listening = false;

const LANG_OPTS = {langs:["tr-TR"], processLocally:true};

function phraseList(f){
  let w = [];
  if(f.t==="yn") w = ["evet","hayır","uygun","uygun değil","yok","uygulanmaz","atla","önceki","tekrar"];
  else if(f.t==="num"){ w = ["bar","buçuk","virgül","adet","kilogram","on","on bir","on iki","on üç","on beş","dokuz","sekiz","yedi","altı","beş","dört","üç","iki","bir","yirmi","otuz","atla","önceki"];
    if(f.unit) w.push(f.unit); w.push("on bar","on bir buçuk","on bir bar","dokuz buçuk"); }
  else if(f.t==="choice") w = f.opts.concat(["atla","önceki"]);
  else w = ["atla","önceki"];
  if(f.t==="yn"){ w = w.concat(Object.keys(S.learn[f.id]||{}), ["temiz","sağlam","çalışıyor","mevcut","işaretli","kirli","bozuk","sızdırıyor"]); }
  return w.map(x=>{ try{ return new SpeechRecognitionPhrase(x, 3.0); }catch(e){ return null; } }).filter(Boolean);
}
if(!SR){ micOK=false; micMsg="Bu tarayıcı ses tanımayı desteklemiyor. Telefonda Chrome ile aç."; }
else if(!window.isSecureContext){ micOK=false; micMsg="Bu adreste mikrofon açılamıyor. Sayfayı https adresinden ya da bilgisayarda http://localhost üzerinden aç."; }
else if(IN_FRAME){ micOK=false; micMsg="Claude önizlemesinde mikrofon kapalı. Sayfayı kendi https adresinden Chrome ile aç ya da aşağıdan yazarak dene."; }

/* ---------- Mikrofon: başlama sesi, güçlendirme ve seviye göstergesi ---------- */
let ACTX = null, BOOST = false, MSTREAM = null, GAINTRACK = null, TRACK_OK = true, meterRAF = null;
try{ BOOST = localStorage.getItem("pk-boost")==="1"; }catch(e){}
function actx(){ try{ if(!ACTX) ACTX = new (window.AudioContext||window.webkitAudioContext)(); if(ACTX.state==="suspended") ACTX.resume(); }catch(e){} return ACTX; }
function beep(){ if(soundMode==="off") return; const c=actx(); if(!c) return; try{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; g.gain.value=0.06; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.08); }catch(e){} }
async function ensureStream(){
  if(GAINTRACK && GAINTRACK.readyState==="live") return GAINTRACK;
  const c = actx(); if(!c || !navigator.mediaDevices) return null;
  MSTREAM = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  const src = c.createMediaStreamSource(MSTREAM), g = c.createGain(), an = c.createAnalyser(), dst = c.createMediaStreamDestination();
  g.gain.value = 2.5; an.fftSize = 512; src.connect(g); g.connect(an); g.connect(dst);
  GAINTRACK = dst.stream.getAudioTracks()[0];
  const buf = new Uint8Array(an.fftSize);
  const tick = ()=>{ an.getByteTimeDomainData(buf); let m=0; for(const v of buf){ const d=Math.abs(v-128); if(d>m) m=d; } const l=$("lvl"); if(l) l.style.width=Math.min(100, m/128*160)+"%"; meterRAF = requestAnimationFrame(tick); };
  cancelAnimationFrame(meterRAF); tick();
  return GAINTRACK;
}
function stopStream(){ cancelAnimationFrame(meterRAF); try{ if(MSTREAM) MSTREAM.getTracks().forEach(t=>t.stop()); }catch(e){} MSTREAM=null; GAINTRACK=null; }
function listen(fromTap){
  if(!started || !cur) return;
  if(fromTap){ try{ speechSynthesis.cancel(); }catch(e){} ttsBusy = false; ttsSeq++; }
  else if(ttsBusy || (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending))){ const id = cur; setTimeout(()=>{ if(cur===id) listen(); }, 300); return; }
  if(byId[cur] && byId[cur].t==="sign" && !defectFor) return;
  if(!fromTap && soundMode!=="all") return;
  if(!micOK){ setLis("na"); return; }
  if(rec){ try{ rec.onend=null; rec.abort(); }catch(e){} rec=null; }
  const forId = cur; listenFor = forId;
  try{
    rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 5;
    if(LOCAL==="available"){ try{ rec.processLocally = true; }catch(e){} }
    if(PHRASE_OK && LOCAL==="available"){ try{ rec.phrases = phraseList(byId[forId]); }catch(e){ PHRASE_OK=false; } }
    rec.onresult = e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r = e.results[i];
        if(!r.isFinal){ if(isEcho(r[0].transcript)) continue; const h=$("heard"); if(h){ h.style.color="var(--muted)"; h.textContent='Duyuluyor: "'+r[0].transcript+'"'; } continue; }
        const alts = Array.from(r).map(a=>a.transcript).filter(t=>t && t.trim());
        if(!alts.length || isEcho(alts[0])) continue;
        listenFor = null;
        try{ rec.onend=null; rec.stop(); }catch(_){} rec=null; listening=false;
        handleSpeech(alts); return;
      }
    };
    rec.onerror = e=>{
      const map = {"not-allowed":"Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.",
        "service-not-allowed":"Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.",
        "network":"Chrome ses tanıması internet istiyor. Bağlantını kontrol et.",
        "audio-capture":"Mikrofon bulunamadı ya da başka bir uygulama kullanıyor.",
        "language-not-supported":"Bu cihazda Türkçe ses tanıma yok."};
      if(e.error==="phrases-not-supported"){ PHRASE_OK=false; listenFor=null; setTimeout(()=>listen(), 200); return; }
      if(e.error==="language-not-supported" && LOCAL==="available"){ LOCAL="unavailable"; engineNote(); listenFor=null; setTimeout(()=>listen(), 200); return; }
      if(usingTrack && (e.error==="audio-capture"||e.error==="aborted")){ TRACK_OK=false; stopStream(); listenFor=null; setTimeout(()=>listen(true), 250); return; }
      if(map[e.error]){ if(e.error!=="network"){ micOK=false; micMsg=map[e.error]; } listenFor=null; setLis("na", map[e.error]); }
    };
    rec.onend = ()=>{ rec=null; listening=false;
      if(listenFor===forId && cur===forId && micOK && soundMode==="all"){ setTimeout(()=>{ if(listenFor===forId && cur===forId) listen(); }, 250); }
      else if(micOK) setLis("off");
    };

  const pt=e=>{ const b=c.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  c.addEventListener("pointerdown", e=>{ draw=true; last=pt(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e=>{ if(!draw) return; const p=pt(e); g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke(); last=p; drawn=true; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev, ()=>{ draw=false; }));
  $("sigClear").addEventListener("click", ()=>{ g.clearRect(0,0,c.width,c.height); drawn=false; });
  $("sigSave").addEventListener("click", ()=>{ if(!drawn){ $("err").textContent="Önce imzanı at"; return; }
    const o=document.createElement("canvas"); o.width=480; o.height=Math.round(480*c.height/c.width); const og=o.getContext("2d"); og.fillStyle="#fff"; og.fillRect(0,0,o.width,o.height); og.drawImage(c,0,0,o.width,o.height);
    commit(cur, o.toDataURL("image/png")); });
}

/* ---------- Soru akışı ---------- */
function qText(f){ return f.q || (f.t==="yn" ? f.l+"?" : f.l+" nedir?"); }
function speakQ(){ const f=byId[cur]; speak(qText(f), false, listen); }
function renderPanel(){
  const f = byId[cur]; const idx = ORDER.indexOf(cur);
  const num = f.t==="yn" ? (" · Madde "+cur.slice(1)) : "";
  let h = '<div class="qno"><span>'+(idx>=0?("Soru "+(idx+1)+" / "+ORDER.length):"İsteğe bağlı")+num+'</span><span id="lis" class="lis"></span></div>';
  h += '<div class="qtx">'+esc(qText(f))+'</div>';
  const hint = ruleHint(cur); if(hint) h += '<div class="hint">'+esc(hint)+'</div>';
  if(S.src[cur]==="otomatik") h += '<div class="hint">Bu madde kurallarla otomatik dolduruldu. Değiştirirsen senin cevabın geçerli olur.</div>';
  const v = S.vals[cur];
  if(f.t==="yn"){
    h += '<div class="grid2">'+YN.map(y=>'<button type="button" class="ans'+(v===y[0]?" sel"+(y[0]==="UD"?" ud":""):"")+'" data-v="'+y[0]+'">'+y[1]+'</button>').join("")+'</div>';
  } else if(f.t==="choice"){
    h += '<div class="grid2">'+f.opts.map(o=>'<button type="button" class="ans'+(v===o?" sel":"")+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div>';
  } else if(f.t==="num"){
    h += '<div class="row"><input class="inp" id="inp" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(v===undefined||v===null||v===""?"":trn(v))+'">'+(f.unit?'<span class="unit">'+esc(f.unit)+'</span>':'')+'<button type="button" class="btn" id="ok">Kaydet</button></div><div class="err" id="err"></div><div id="wr"></div>';
  } else if(f.t==="sign"){
    h += '<div class="sigwrap"><canvas id="sig" aria-label="İmza alanı"></canvas></div><div class="row" style="margin-top:8px"><button type="button" class="btn ghost" id="sigClear" style="flex:1">Temizle</button><button type="button" class="btn" id="sigSave" style="flex:1">İmzayı kaydet</button></div><div class="err" id="err"></div>';
  } else {
    h += '<div class="row"><input class="inp txt" id="inp" autocomplete="off" value="'+esc(v||"")+'"><button type="button" class="btn" id="ok">Kaydet</button></div><div class="err" id="err"></div>';
  }
  h += '<div class="heard" id="heard"></div>';
  h += '<button type="button" class="mic" id="micBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Konuşmak için dokun</span></button><div class="small" id="micMsg"></div><div class="small" id="engine" style="margin-top:4px"></div>';
  if(!micOK) h = h.replace(/<button type="button" class="mic"[\s\S]*?<\/button><div class="small" id="micMsg"><\/div>/, "");
  h += '<div class="nav"><button type="button" class="sm" id="prev">Önceki</button><button type="button" class="sm" id="skip">'+(f.optional?"Geç":"Atla")+'</button></div>';
  h += '<div class="small" id="voiceRow" style="margin-top:10px"></div>';
  $("panel").innerHTML = h;
  setLis(micOK ? "off" : "na");
  engineNote();
  if($("micBtn")) $("micBtn").addEventListener("click", ()=>{ try{ speechSynthesis.cancel(); }catch(e){} if(listening){ stopListen(); } else { listen(true); } });
  document.querySelectorAll(".ans").forEach(b=>b.addEventListener("click", ()=>{
    clearTimeout(pendingTimer); const v=b.dataset.v; const msg = learnFrom(v);
    if(msg){ stopListen(); document.querySelectorAll(".ans").forEach(x=>x.classList.toggle("sel", x===b)); const h=$("heard"); if(h){ h.style.color="var(--ok)"; h.textContent=msg; } setTimeout(()=>commit(cur, v), 1300); }
    else commit(cur, v); }));
  if($("ok")) $("ok").addEventListener("click", submitInput);
  if($("inp")){ $("inp").addEventListener("keydown", e=>{ if(e.key==="Enter") submitInput(); }); $("inp").addEventListener("input", ()=>{ $("err").textContent=""; liveWarn(); }); liveWarn(); }
  $("prev").addEventListener("click", goPrev);
  $("skip").addEventListener("click", goNext);
  if(f.t==="sign") requestAnimationFrame(signPanelInit);
  voiceRow();
}
function liveWarn(){ const w=$("wr"); if(!w) return; const x=parseNum($("inp").value||""); const m = x===null?"":checkWarn(cur,x); w.innerHTML = m ? '<div class="warn">'+esc(m)+'</div>' : ""; }
function submitInput(){
  const f = byId[cur], raw = $("inp").value.trim();
  if(f.t==="num"){
    const x = parseNum(raw);
    if(raw==="" || x===null || isNaN(x)){ $("err").textContent = "Bir sayı gir, örneğin 11,5"; return; }
    if(!plausible(cur, x) && typedConfirm!==cur+":"+x){ typedConfirm = cur+":"+x; $("err").textContent = "Bu değer beklenenden çok farklı. Doğruysa tekrar Kaydet'e bas."; buzz([60,40,60]); return; }
    typedConfirm = null;
    if(lastHeard && lastHeard.q===cur && lastHeard.parsed===null){ const n = norm(lastHeard.text);
      if(n && n.length<=40 && !/^[\d.,\s]+$/.test(n)){ S.learnN[n] = x; save(); queueVote("sayi", n, x); } }
    commit(cur, x);
  } else {
    if(raw==="" && !f.optional){ $("err").textContent = "Bu alan boş bırakılamaz"; return; }
    commit(cur, raw);
  }
}
function commit(id, val){
  stopListen();
  if(byId[id].auto) S.over[id] = true;
  S.vals[id] = val; S.src[id] = "kullanıcı";
  const w = checkWarn(id, val);
  paint();
  buzz(w ? [90,60,90] : 35);
  const after = ()=>{ $("r-"+id).classList.remove("act","miss");
    $("panel").innerHTML = '<p class="msg small">Kaydedildi.</p>';
    setTimeout(()=>goNextFrom(id), 350); };
  const next = (byId[id].t==="yn" && val==="UD") ? ()=>defectPanel(id, after) : after;
  if(w){ $("panel").insertAdjacentHTML("beforeend", '<div class="warn">'+esc(w)+'</div>'); speak(w, true, ()=>setTimeout(next, 300)); }
  else next();
}
function ask(id){
  if(!started) return;
  lastHeard = null; defectFor = null; defectDone = null; clearTimeout(defectTimer);
  clearTimeout(pendingTimer);
  if(cur){ const p=$("r-"+cur); if(p) p.classList.remove("act"); }
  cur = id; setManual(false);
  const r = $("r-"+id); r.classList.remove("miss"); r.classList.add("act");
  renderPanel();
  requestAnimationFrame(()=>requestAnimationFrame(()=>applyScale(1, id, true)));
  if(soundMode==="all") speakQ();
}
function goNextFrom(id){
  if(manual){ renderIdle(); return; }
  const i = ORDER.indexOf(id);
  const after = ORDER.slice(i+1).find(isEmpty);
  if(after) return ask(after);
  finish();
}
function goNext(){ stopListen(); const id=cur; $("r-"+id).classList.remove("act"); setTimeout(()=>goNextFrom(id), 150); }
function goPrev(){ stopListen(); const i = ORDER.indexOf(cur); if(i>0) ask(ORDER[i-1]); }
function renderIdle(){ $("panel").innerHTML = '<p class="msg">Serbest gezinme açık.</p><p class="small">Değiştirmek istediğin satıra dokun ya da üstteki "Kaldığım yerden devam" düğmesine bas.</p>'; }
function finish(){
  stopListen(); cur = null; setManual(false);
  const miss = ORDER.filter(isEmpty);
  if(miss.length){
    miss.forEach(id=>$("r-"+id).classList.add("miss"));
    applyScale(OUT, miss[0], true);
    $("panel").innerHTML = '<p class="msg">'+miss.length+' madde eksik.</p><p class="small">Sarı satırlar boş kaldı. İlk eksik maddeye gidiliyor...</p>';
    speak(miss.length+" madde eksik. İlk eksik maddeye gidiyorum.", true, ()=>{});
    setTimeout(()=>ask(miss[0]), 1600);
    return;
  }
  if(!S.bit) S.bit = new Date().toISOString();
  paint();
  applyScale(OUT, "sonuc", true);
  const bad = ORDER.some(id=>S.vals[id]==="UD");
  const kus = S.vals.kusurlar && S.vals.kusurlar!=="Yok" ? '<div class="warn" style="white-space:pre-line">'+esc(S.vals.kusurlar)+'</div>' : "";
  $("panel").innerHTML = '<p class="msg ok">Tamamlandı, eksik madde yok.</p><p class="small">Sonuç: '+(bad?"uygun değil.":"uygun.")+' Herhangi bir satıra dokunarak hâlâ düzeltebilirsin.</p>'+kus+
    '<div class="row" style="margin-top:10px"><button type="button" class="btn" id="pdf" style="flex:1">PDF oluştur</button><button type="button" class="btn ghost" id="reset">Sıfırla</button></div><div class="small" id="pdfmsg" style="margin-top:8px"></div>';
  speak("Form tamamlandı.", true, ()=>{});
  $("pdf").addEventListener("click", ()=>{
    applyScale(1, null, false);
    let ok = true; try{ window.print(); }catch(e){ ok=false; }
    $("pdfmsg").textContent = "Yazdırma penceresinde “PDF olarak kaydet” seç. Claude önizlemesinde yazdırma kapalıdır; dosyayı telefonda Chrome ile açınca çalışır.";
  });
  $("reset").addEventListener("click", resetAll);
}
function resetAll(){ try{ localStorage.removeItem(KEY); }catch(e){} const keep={learn:S.learn||{}, learnG:S.learnG||{}, learnN:S.learnN||{}, outbox:S.outbox||{}, sent:S.sent||{}}; S={vals:{},src:{},over:{},bas:null,bit:null,tarih:null,defects:{},...keep}; save(); photoClear(); initVals(); started=false; cur=null; document.querySelectorAll(".act,.miss").forEach(r=>r.classList.remove("act","miss")); paint(); applyScale(OUT,null,false); vp.scrollTo({top:0}); startScreen(); }

/* ---------- Satıra dokunarak düzeltme ---------- */
$("doc").addEventListener("click", e=>{
  const r = e.target.closest("[data-id]"); if(!r) return;
  if(!started){ begin(r.dataset.id); return; }
  ask(r.dataset.id);
});

/* ---------- Başlangıç ---------- */
function startScreen(){
  const left = ORDER.filter(isEmpty).length;
  $("panel").innerHTML = '<p class="msg">Geçen yılın kazan bilgileri hazır. '+left+' madde sorulacak.</p><p class="small">Sorular sesli okunur, cevabı söyleyebilir ya da dokunabilirsin. Formda istediğin satıra dokunup oradan da başlayabilirsin.</p><div class="row" style="margin-top:10px"><button type="button" class="btn" id="go" style="flex:1">Kontrole başla</button></div>';
  $("go").addEventListener("click", ()=>begin(null));
}
/* ---------- Ekranı açık tutma ve geri dönünce kaldığı yerden devam ---------- */
let wakeLock = null;
async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible"){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){ if(rec){ try{ rec.onend=null; rec.abort(); }catch(e){} rec=null; listening=false; } try{ speechSynthesis.cancel(); }catch(e){} return; }
  if(!started) return;
  keepAwake();
  if(cur){ renderPanel(); const h=$("heard"); if(h){ h.style.color="var(--muted)"; h.textContent="Kaldığın yerden devam ediyoruz."; }
    if(soundMode==="all") setTimeout(speakQ, 400); }
});
function begin(id){
  started = true; actx(); keepAwake(); if(micOK) checkLocal();
  if(!S.bas) S.bas = new Date().toISOString();
  paint();
  const first = id || ORDER.find(isEmpty);
  if(first) ask(first); else finish();
}
if("serviceWorker" in navigator && location.protocol==="https:" && !IN_FRAME){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
load(); S.learn = S.learn || {}; S.learnG = S.learnG || {}; S.defects = S.defects || {}; initVals(); buildDoc(); paint(); layout();
requestAnimationFrame(()=>{ applyScale(OUT, null, false); });
startScreen();
</script>
</body>
