<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buhar Kazanı Saha Formu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: tek sütun telefon uygulaması. Üstte durum çubuğu, ortada kaydırılabilen rapor kağıdı, altta cevap paneli. */
  --bg:#e9ecef; --paper:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#c9d1d9;
  --accent:#1f5fa8; --accent-bg:#e3eefa; --ok:#1d7a45; --ok-bg:#e2f3e8; --bad:#b4282a; --bad-bg:#fbe5e5;
  --warn-bg:#fff2c7; --warn:#8a5a00; --chip:#f2f4f6;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --paper:#1a2129; --ink:#e6ebf0; --muted:#9aa7b4; --line:#33404d;
    --accent:#6aa8ee; --accent-bg:#1b3350; --ok:#5fd08f; --ok-bg:#163526; --bad:#ff8a8a; --bad-bg:#3e1d1e;
    --warn-bg:#3a2f12; --warn:#f2c25b; --chip:#232c36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --paper:#1a2129; --ink:#e6ebf0; --muted:#9aa7b4; --line:#33404d;
  --accent:#6aa8ee; --accent-bg:#1b3350; --ok:#5fd08f; --ok-bg:#163526; --bad:#ff8a8a; --bad-bg:#3e1d1e;
  --warn-bg:#3a2f12; --warn:#f2c25b; --chip:#232c36; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--chip);font-size:13px;white-space:nowrap}
.pill.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.pill svg{width:16px;height:16px}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:4px;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
.vpwrap{position:relative;flex:1;min-height:0}
.vp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sizer{position:relative}
.pg{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){.pg{transition:transform .5s ease}.sizer{transition:height .5s ease}}
.chip{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:20px;background:var(--ink);color:var(--paper);font-size:13px;z-index:3;white-space:nowrap}
.chip button{height:30px;border-radius:15px;border:0;background:var(--paper);color:var(--ink);padding:0 12px;font-weight:500}
.chip.show{display:flex}
/* rapor kağıdı */
.doc{padding:16px 14px 20px}
.doc h1{font-size:16px;font-weight:600;margin:0 0 2px;text-wrap:balance;letter-spacing:.2px}
.doc .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.sec{margin-top:14px;font-size:11.5px;font-weight:600;letter-spacing:.4px;padding:6px 8px;background:var(--chip);border:1px solid var(--line);border-bottom:0}
.tbl{border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:44% 56%;border-top:1px solid var(--line);min-height:36px;cursor:pointer}
.kv:first-child{border-top:0}
.kv .k{padding:7px 8px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.kv .v{padding:7px 8px;font-size:13px;font-family:var(--font-num);font-variant-numeric:tabular-nums;word-break:break-word}
.kv.ro{cursor:default}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-family:var(--font-body);font-size:10px;font-weight:500;background:var(--chip);color:var(--muted);vertical-align:1px}
.tag.auto{background:var(--accent-bg);color:var(--accent)}
.ckh,.ck{display:grid;grid-template-columns:24px 1fr repeat(4,30px)}
.ckh{font-size:10.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.ckh div{padding:5px 0;text-align:center;border-left:1px solid var(--line)}
.ckh div:nth-child(2){text-align:left;padding-left:6px}
.ckh div:first-child{border-left:0}
.ck{border-top:1px solid var(--line);min-height:44px;cursor:pointer}
.ckh + .ck{border-top:0}
.ck .no{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.ck .tx{padding:6px 6px;font-size:12.5px;line-height:1.35;border-left:1px solid var(--line)}
.ck .tx .ref{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.ck .tx .note{display:block;font-size:11px;margin-top:3px;color:var(--bad)}
.ck .m{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:15px}
.ck .m.x{color:var(--ok)}
.ck .m.x.ud{color:var(--bad);background:var(--bad-bg)}
.ck .m.x.dash,.ck .m.x.nu{color:var(--muted)}
.act{background:var(--accent-bg) !important;box-shadow:inset 3px 0 0 var(--accent)}
.miss{background:var(--warn-bg) !important;box-shadow:inset 3px 0 0 var(--warn)}
.res{padding:10px 8px;font-size:13px;font-weight:600}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.foot{margin-top:12px;font-size:10px;color:var(--muted);line-height:1.5}
/* cevap paneli */
.panel{background:var(--paper);border-top:1px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:52%;overflow-y:auto}
.qno{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.qtx{font-size:17px;font-weight:600;line-height:1.35;margin:4px 0 10px;text-wrap:balance}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:15px;font-weight:500}
.ans.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.ans.sel.ud{background:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 12px;font-size:20px;font-family:var(--font-num);text-align:center}
.inp.txt{font-size:15px;font-family:var(--font-body);text-align:left}
.unit{font-size:14px;color:var(--muted)}
.btn{height:50px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.4}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.nav .sm{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:transparent;font-size:13px}
.lis{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lis.on{color:var(--bad)}
.lis .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.lis.on .dot{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:10px;border-radius:24px;border:1px solid var(--line);background:var(--chip);font-weight:500}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.heard{font-size:12.5px;color:var(--ok);margin-top:6px}
.test{display:flex;gap:6px;margin-top:10px}
.test input{flex:1;min-width:0;height:36px;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:0 10px;font-size:13px}
.test button{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 10px;font-size:13px}
.msg{font-size:15px;line-height:1.5}
.msg.ok{color:var(--ok)}
.small{font-size:12.5px;color:var(--muted);line-height:1.5}
@media print{
  body{background:#fff;color:#000}
  .top,.prog,.panel,.chip{display:none !important}
  .app{height:auto;display:block;max-width:none}
  .vpwrap,.vp{position:static;overflow:visible;height:auto}
  .sizer{height:auto !important}
  .pg{position:static;transform:none !important;width:auto !important;box-shadow:none}
  .act,.miss{background:none !important;box-shadow:none !important}
  .kv,.ck{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><b>Buhar kazanı periyodik kontrol</b><span id="stat">Örnek Tekstil, Tuzla</span></div>
    <button class="pill" id="zoomBtn" type="button" aria-label="Yakınlaştır veya uzaklaştır">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/><path id="zplus" d="M10 7v6"/><path d="M7 10h6"/></svg><span id="zoomTxt">Genel</span></button>
    <button class="pill on" id="sndBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sw1" d="M16 9a4 4 0 0 1 0 6"/><path id="sw2" d="M19 6a8 8 0 0 1 0 12"/></svg><span id="sndTxt">Sesli</span></button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="vpwrap">
    <div class="chip" id="chip">Serbest gezinme <button type="button" id="resume">Kaldığım yerden devam</button></div>
    <div class="vp" id="vp"><div class="sizer" id="sizer"><div class="pg" id="pg"><div class="doc" id="doc"></div></div></div></div>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>
<script>
"use strict";
/* ---------- Form tanımı: buhar kazanı periyodik kontrol raporu ---------- */
const F = [
 {sec:"Genel bilgiler", kind:"kv"},
 {id:"kurulus", l:"Raporu isteyen kuruluş", t:"text", v:"Örnek Tekstil San. A.Ş., Tuzla / İstanbul", src:"örnek"},
 {id:"sgk", l:"SGK işyeri sicil no", t:"text", v:"2 1234 01 01 1234567 034", src:"örnek"},
 {id:"katip", l:"İSG-KATİP sözleşme no", t:"text", q:"İSG-KATİP sözleşme numarası nedir?", hint:"Sözleşme, kontrolden en az bir gün önce onaylanmış olmalı."},
 {id:"tarih", l:"Kontrol tarihi", t:"calc"},
 {id:"bas", l:"Başlangıç saati", t:"calc"},
 {id:"bit", l:"Bitiş saati", t:"calc"},
 {id:"gelecek", l:"Gelecek kontrol tarihi", t:"calc"},
 {id:"raporno", l:"Rapor no", t:"calc"},
 {sec:"İş ekipmanının teknik özellikleri", kind:"kv"},
 {id:"marka", l:"Markası / tipi", t:"text", v:"Termo-Pak / 3 geçişli silindirik", src:"geçen yıl"},
 {id:"seri", l:"Seri no", t:"text", v:"TP-2019-0457", src:"geçen yıl"},
 {id:"yil", l:"Üretim yılı", t:"num", unit:"", v:2019, src:"geçen yıl"},
 {id:"yakit", l:"Yakıt türü", t:"choice", opts:["Doğalgaz","Fuel-oil","Kömür","LPG","Elektrik"], v:"Doğalgaz", src:"geçen yıl"},
 {id:"kapasite", l:"Kapasite", t:"num", unit:"kg/h", v:2000, src:"geçen yıl"},
 {id:"tasarim", l:"Tasarım basıncı", t:"num", unit:"bar", v:12, src:"geçen yıl"},
 {id:"isletme", l:"İşletme basıncı", t:"num", unit:"bar", v:10, src:"geçen yıl"},
 {id:"deney", l:"Deney basıncı (1,5 kat)", t:"calc"},
 {id:"ventilSay", l:"Emniyet ventili sayısı", t:"num", unit:"adet", v:2, src:"geçen yıl"},
 {id:"ventil1", l:"Emniyet ventili 1 açma basıncı", t:"num", unit:"bar", q:"Emniyet ventili 1 kaç barda açtı?"},
 {id:"ventil2", l:"Emniyet ventili 2 açma basıncı", t:"num", unit:"bar", q:"Emniyet ventili 2 kaç barda açtı?"},
 {id:"manometre", l:"Manometre sayısı / skalası", t:"text", v:"2 adet / 0-25 bar", src:"geçen yıl"},
 {id:"suSeviye", l:"Su seviye gösterge sayısı", t:"num", unit:"adet", v:2, src:"geçen yıl"},
 {sec:"Kazan genel kontrolleri, yardımcı donanımlar ve tesisat", kind:"ck"},
 {id:"c1", l:"Kazanın sicil kartı veya bakım defteri", ref:"TS 2025", t:"yn"},
 {id:"c2", l:"Kazan işletmecisinin belgesi", ref:"Binaların Yangından Korunması Hk. Yön.", t:"yn"},
 {id:"c3", l:"Yakıt hazırlama ve su hazırlama sistemi", ref:"TS 2025", t:"yn"},
 {id:"c4", l:"Kazana bağlı boru devreleri, vana ve flanşlerde sızıntı yok", ref:"", t:"yn"},
 {id:"c5", l:"Kazan sağlam bir taban üzerine uygun şekilde monte edilmiş", ref:"İş Ekip. Yön.", t:"yn"},
 {id:"c6", l:"Kazan zemin seviyesinden yeterli yükseklikte", ref:"", t:"yn"},
 {id:"c7", l:"Azami işletme basıncı manometre üzerinde işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c8", l:"Manometre ve göstergeler kolayca görülebilir", ref:"TS 497", t:"yn"},
 {id:"c9", l:"Giriş ve çıkış vanaları var, açık/kapalı konumları işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c10", l:"Giriş ve çıkış devrelerinde yön işaretleri var", ref:"", t:"yn"},
 {id:"c11", l:"Boşaltma vanası veya musluğu var", ref:"TS EN 12953-6", t:"yn"},
 {id:"c12", l:"Düşük su koruması ve besleme suyu sistemi çalışıyor", ref:"TS EN 12953-6", t:"yn"},
 {id:"c13", l:"Yakıt ve ısıtıcı devresinde sızıntı yok", ref:"TS 2025", t:"yn"},
 {id:"c14", l:"Gidiş ve dönüş borularında birer termometre (sıcak su kazanlarında)", ref:"TS EN 12953-6", t:"yn", auto:true},
 {id:"c15", l:"Termometrelerde en yüksek akış sıcaklığı işareti (sıcak su kazanlarında)", ref:"TS EN 12953-6", t:"yn", auto:true},
 {id:"c16", l:"Su seviye göstergelerinin camları temiz ve sağlam", ref:"TS 2025", t:"yn"},
 {id:"c17", l:"Su seviye göstergeleri aynı seviyeyi gösteriyor, minimum seviye işaretli", ref:"TS EN 12953-6", t:"yn"},
 {id:"c18", l:"Emniyet ventilleri kazana doğrudan bağlı, çıkış ağızları uygun", ref:"", t:"yn"},
 {id:"c19", l:"Emniyet ventili sayısı yeterli (buhar kazanlarında en az iki)", ref:"TS 2025", t:"yn", auto:true},
 {id:"c20", l:"Kazan dairesi yönetmelik esaslarına uygun", ref:"Binaların Yangından Korunması Hk. Yön.", t:"yn"},
 {id:"c21", l:"Yanma yüzeyleri temiz", ref:"TS 2025", t:"yn"},
 {sec:"Hidrostatik deney ve testler", kind:"ck"},
 {id:"c22", l:"Emniyet ventilleri azami işletme basıncının en çok %10 fazlasında açıyor", ref:"TS EN 12953-8", t:"yn", auto:true},
 {id:"c23", l:"İşletme basıncının 1,5 katında yarım saat deneyde deformasyon ve sızıntı yok", ref:"İş Ekip. Yön., TS EN 13445-5", t:"yn"},
 {id:"c24", l:"Basınç altında gövdede deformasyon, sızdırma veya şekil bozukluğu yok", ref:"İş Ekip. Yön.", t:"yn"},
 {id:"c25", l:"Manometreler doğru ve kalibrasyonları geçerli", ref:"TS 2025", t:"yn"},
 {sec:"Notlar ve sonuç", kind:"kv"},
 {id:"notlar", l:"Notlar", t:"text", optional:true, q:"Eklemek istediğin bir not var mı?"},
 {id:"sonuc", l:"Sonuç", t:"calc"},
 {sec:"Kontrolü yapan", kind:"kv"},
 {id:"ad", l:"Adı soyadı", t:"text", v:"Örnek Mühendis", src:"profil"},
 {id:"meslek", l:"Mesleği", t:"text", v:"Makine mühendisi", src:"profil"},
 {id:"ekipnet", l:"EKİPNET kayıt no", t:"text", v:"K00000000", src:"profil"}
];
const YN = [["U","Uygun"],["UD","Uygun değil"],["-","Yok"],["NU","Uygulanmaz"]];
const byId = {}; F.forEach(f=>{ if(f.id) byId[f.id]=f; });
const ORDER = F.filter(f=>f.id && f.t!=="calc" && !f.optional).map(f=>f.id);
const OUT = 0.46;

/* ---------- Durum ---------- */
let S = {vals:{}, src:{}, over:{}, bas:null, bit:null, tarih:null};
let cur = null, scale = 1, manual = false, soundMode = "all", started = false, pendingTimer = null;
const KEY = "pk-buhar-saha-v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.vals) S = s; }catch(e){} }
function initVals(){
  F.forEach(f=>{ if(f.id && f.v!==undefined && S.vals[f.id]===undefined){ S.vals[f.id]=f.v; S.src[f.id]=f.src; } });
  if(!S.tarih){ S.tarih = new Date().toISOString(); }
}

/* ---------- Yardımcılar ---------- */
const $ = id => document.getElementById(id);
const trn = n => (Math.round(n*100)/100).toString().replace(".", ",");
const fmtDate = d => d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtTime = d => d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function isEmpty(id){ const v=S.vals[id]; return v===undefined || v===null || v===""; }

/* ---------- Kurallar (yapay zekâ yok, sadece hesap) ---------- */
let lastWarn = "";
function compute(){
  const v = S.vals, isl = Number(v.isletme);
  const lim = isl ? Math.round(isl*1.1*100)/100 : null;
  v.deney = isl ? trn(isl*1.5)+" bar" : "";
  const t = new Date(S.tarih);
  v.tarih = fmtDate(t);
  const g = new Date(t); g.setFullYear(g.getFullYear()+1); v.gelecek = fmtDate(g);
  v.raporno = "PK-"+t.toISOString().slice(0,10).replace(/-/g,"")+"-001";
  v.bas = S.bas ? fmtTime(new Date(S.bas)) : "";
  v.bit = S.bit ? fmtTime(new Date(S.bit)) : "";
  ["c14","c15"].forEach(id=>{ if(!S.over[id]){ v[id]="NU"; S.src[id]="otomatik"; } });
  byId.c14.note = byId.c15.note = S.over.c14 ? "" : "Buhar kazanında uygulanmaz.";
  if(!S.over.c19){
    if(v.ventilSay!==undefined && v.ventilSay!==null && v.ventilSay!==""){ v.c19 = Number(v.ventilSay)>=2 ? "U" : "UD"; S.src.c19="otomatik"; }
  }
  byId.c19.note = (v.c19==="UD" && !S.over.c19) ? "Buhar kazanında en az iki emniyet ventili gerekir." : "";
  byId.c22.note = "";
  if(!S.over.c22 && lim!==null && !isEmpty("ventil1") && (Number(v.ventilSay)<2 || !isEmpty("ventil2"))){
    const a = Number(v.ventil1), b = isEmpty("ventil2") ? 0 : Number(v.ventil2);
    const bad = a>lim || b>lim;
    v.c22 = bad ? "UD" : "U"; S.src.c22 = "otomatik";
    if(bad) byId.c22.note = "Sınır "+trn(lim)+" bar. Ölçülen: "+trn(a)+(isEmpty("ventil2")?"":" ve "+trn(b))+" bar.";
  } else if(!S.over.c22){ v.c22 = null; }
  const missing = ORDER.filter(isEmpty);
  if(missing.length) v.sonuc = "";

function ruleHint(id){

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micOK = !!SR;
function setSound(mode){

}
$("sndBtn").addEventListener("click", ()=>setSound(soundMode==="all"?"warn":soundMode==="warn"?"off":"all"));
function speak(text, isWarn, cb){
  const ok = soundMode==="all" || (soundMode==="warn" && isWarn);
  if(!ok || !("speechSynthesis" in window)){ if(cb) cb(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "tr-TR"; u.rate = 1.05;
    let called = false; const fin = ()=>{ if(!called){ called=true; if(cb) cb(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, Math.min(7000, 1500 + text.length*80));
    speechSynthesis.speak(u);
  }catch(e){ if(cb) cb(); }
}
const IN_FRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
let micMsg = "", listenFor = null, listening = false;
if(!SR){ micOK=false; micMsg="Bu tarayıcı ses tanımayı desteklemiyor. Telefonda Chrome ile aç."; }
else if(!/^https:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ micOK=false; micMsg="Sayfa dosyadan açıldı. Chrome mikrofonu sadece https adresindeki sayfalara açar. Sayfayı bir https adresine yükleyip oradan aç."; }
else if(IN_FRAME){ micOK=false; micMsg="Claude önizlemesinde mikrofon kapalı. Sayfayı kendi https adresinden Chrome ile aç ya da aşağıdan yazarak dene."; }
function setLis(state, txt){ const l = $("lis"); if(!l) return;
  if(state==="on"){ l.className="lis on"; l.innerHTML='<span class="dot"></span>Dinliyor...'; }
  else if(state==="na"){ l.className="lis"; l.textContent='Mikrofon kapalı'; }
  else if(soundMode==="all"){ l.className="lis"; l.textContent='Mikrofon beklemede'; }
  else { l.className="lis"; l.textContent='Ses kapalı'; }
  const m=$("micMsg"); if(m) m.textContent = txt!==undefined ? txt : (state==="na"?micMsg:"");
  const mb=$("micBtn"); if(mb){ mb.classList.toggle("on", state==="on"); mb.querySelector("span").textContent = state==="on" ? "Dinliyorum, konuş" : "Konuşmak için dokun"; }
}
function stopListen(){ listenFor=null; listening=false; if(rec){ try{ rec.onend=null; rec.onresult=null; rec.abort(); }catch(e){} rec=null; } setLis(micOK?"off":"na"); }
function listen(fromTap){
  if(!started || !cur) return;
  if(!fromTap && soundMode!=="all") return;
  if(!micOK){ setLis("na"); return; }
  if(rec){ try{ rec.onend=null; rec.abort(); }catch(e){} rec=null; }
  const forId = cur; listenFor = forId;
  try{
    rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 3;
    rec.onresult = e=>{
      const r = e.results[e.results.length-1];
      if(!r.isFinal){ const h=$("heard"); if(h){ h.style.color="var(--muted)"; h.textContent='Duyuluyor: "'+r[0].transcript+'"'; } return; }
      listenFor = null;
      handleSpeech(Array.from(r).map(a=>a.transcript));
    };
    rec.onerror = e=>{
      const map = {"not-allowed":"Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.",
        "service-not-allowed":"Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin ver.",
        "network":"Chrome ses tanıması internet istiyor. Bağlantını kontrol et.",
        "audio-capture":"Mikrofon bulunamadı ya da başka bir uygulama kullanıyor.",
        "language-not-supported":"Bu cihazda Türkçe ses tanıma yok."};
      if(map[e.error]){ if(e.error!=="network"){ micOK=false; micMsg=map[e.error]; } listenFor=null; setLis("na", map[e.error]); }
    };
    rec.onend = ()=>{ rec=null; listening=false;
      if(listenFor===forId && cur===forId && micOK && soundMode==="all"){ setTimeout(()=>{ if(listenFor===forId && cur===forId) listen(); }, 250); }
      else if(micOK) setLis("off");
    };

  }catch(e){ setLis("na", "Mikrofon başlatılamadı: "+e.message); }
}
/* ---------- Konuşmayı anlama: kurallarla, yapay zekâsız ---------- */
const NW = {"sıfır":0,"bir":1,"iki":2,"üç":3,"dört":4,"beş":5,"altı":6,"yedi":7,"sekiz":8,"dokuz":9,"on":10,"yirmi":20,"otuz":30,"kırk":40,"elli":50,"altmış":60,"yetmiş":70,"seksen":80,"doksan":90};
function parseNum(s){
  s = s.toLocaleLowerCase("tr").replace(/(\d)[.,](\d)/g,"$1 virgül $2").replace(/,/g," virgül ").replace(/nokta/g,"virgül");
  const tk = s.split(/\s+/).filter(Boolean);
  let total=0, cur=0, inDec=false, dec="", decCur=0, decHas=false, half=false, found=false;
  for(const w of tk){
    if(/^\d+$/.test(w)){ found=true; if(inDec){ dec+=w; } else cur += parseInt(w,10); continue; }
    if(w==="virgül"){ inDec=true; continue; }
    if(w==="buçuk"||w==="buçuktu"){ half=true; found=true; continue; }
    if(w in NW){ found=true; const n=NW[w];
      if(inDec){ if(decHas && n<10 && decCur>=10 && decCur%10===0){ decCur+=n; } else { if(decHas) dec+=String(decCur); decCur=n; decHas=true; } }
      else cur+=n; continue; }
    if(w==="yüz"){ found=true; if(inDec){ decCur=(decCur||1)*100; decHas=true; } else cur=(cur||1)*100; continue; }
    if(w==="bin"){ found=true; total+=(cur||1)*1000; cur=0; continue; }
  }
  if(!found) return null;
  if(decHas) dec += String(decCur);
  return total + cur + (dec ? parseFloat("0."+dec) : 0) + (half?0.5:0);
}
function parseYN(s){
  s = " "+s.toLocaleLowerCase("tr")+" ";
  if(/uygulanmaz|kapsam dışı|uygulanamaz/.test(s)) return "NU";
  if(/uygun değil|değil|hayır|olumsuz|uygunsuz/.test(s)) return "UD";
  if(/\byok\b|\s+yok\s+/.test(s)) return "-";
  if(/evet|uygun|var|tamam|olumlu|doğru/.test(s)) return "U";
  return null;
}
function parseCmd(s){
  s = s.toLocaleLowerCase("tr");
  if(/önceki|geri dön|bir önceki/.test(s)) return "prev";
  if(/atla|sonra bakar|geç\b/.test(s)) return "skip";
  if(/tekrar|bir daha/.test(s)) return "repeat";
  return null;
}
function handleSpeech(alts){
  const f = byId[cur]; if(!f) return;
  for(const a of alts){
    const c = parseCmd(a);
    if(c==="prev"){ goPrev(); return; }
    if(c==="skip"){ goNext(); return; }
    if(c==="repeat"){ renderPanel(); speakQ(); return; }
    let val = null;
    if(f.t==="yn") val = parseYN(a);
    else if(f.t==="num") val = parseNum(a);
    else if(f.t==="choice") val = f.opts.find(o=>a.toLocaleLowerCase("tr").includes(o.toLocaleLowerCase("tr"))) || null;
    else if(f.t==="text") val = a.trim();
    if(val!==null && val!==""){
      showHeard(a, val);
      if(f.t==="num"){ const i=$("inp"); if(i) i.value = trn(val); }
      if(f.t==="yn"||f.t==="choice"){ document.querySelectorAll(".ans").forEach(b=>b.classList.toggle("sel", b.dataset.v===val)); }
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(()=>commit(cur, val), 900);
      return;
    }
  }
  const h=$("heard"); if(h){ h.style.color="var(--bad)"; h.textContent='Anlaşılmadı: "'+alts[0]+'". Tekrar söyle ya da dokun.'; }
  setTimeout(listen, 800);
}
function showHeard(a, val){ const h=$("heard"); if(!h) return; h.style.color=""; const f=byId[cur];
  const shown = f.t==="yn" ? YN.find(y=>y[0]===val)[1] : f.t==="num" ? trn(val)+(f.unit?" "+f.unit:"") : val;
  h.textContent = 'Duyulan: "'+a+'" → '+shown; }

}
function liveWarn(){ const w=$("wr"); if(!w) return; const x=parseNum($("inp").value||""); const m = x===null?"":checkWarn(cur,x); w.innerHTML = m ? '<div class="warn">'+esc(m)+'</div>' : ""; }

function commit(id, val){

/* ---------- Başlangıç ---------- */
function startScreen(){
  const left = ORDER.filter(isEmpty).length;
  $("panel").innerHTML = '<p class="msg">Geçen yılın kazan bilgileri hazır. '+left+' madde sorulacak.</p><p class="small">Sorular sesli okunur, cevabı söyleyebilir ya da dokunabilirsin. Formda istediğin satıra dokunup oradan da başlayabilirsin.</p><div class="row" style="margin-top:10px"><button type="button" class="btn" id="go" style="flex:1">Kontrole başla</button></div>';
  $("go").addEventListener("click", ()=>begin(null));
}
function begin(id){
  started = true;
  if(!S.bas) S.bas = new Date().toISOString();
  paint();
  const first = id || ORDER.find(isEmpty);
  if(first) ask(first); else finish();
}
load(); initVals(); buildDoc(); paint(); layout();
requestAnimationFrame(()=>{ applyScale(OUT, null, false); });
startScreen();
</script>
